name: Test GanzPortalok

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Verify that no environment file is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "Tiltott környezeti fájl került a repositoryba." >&2
            exit 1
          fi

      - name: Build and run source tests
        run: docker build --target test -t ganzportalok-test:verification .

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder
          ACME_EMAIL: administration@ganzportalok.hu
        run: docker compose config --quiet
