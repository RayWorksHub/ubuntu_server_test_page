name: ganzportalok-test

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ganzportalok}
      POSTGRES_USER: ${POSTGRES_USER:-ganzportalok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ganzportalok} -d ${POSTGRES_DB:-ganzportalok}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ganzportalok}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ganzportalok}?schema=public
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - web
      - database
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --loglevel info run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      caddy:
        condition: service_started
    networks:
      - web
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  web:
  database:
    internal: true
